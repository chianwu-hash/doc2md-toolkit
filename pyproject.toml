[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc2md-toolkit"
version = "0.2.0"
description = "Unified CLI for converting teaching PDFs and documents to Markdown or text with pdf2txt and MarkItDown."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "doc2md-toolkit contributors" }
]
keywords = ["markdown", "pdf", "docx", "markitdown", "education"]
dependencies = [
  "markitdown>=0.1.8,<0.2",
  "PyMuPDF>=1.28.2,<1.29"
]

[project.optional-dependencies]
all = [
  "markitdown[docx,pptx,xlsx,xls,pdf]>=0.1.8,<0.2"
]
dev = [
  "pytest>=8"
]

[project.scripts]
doc2md = "doc2md_toolkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doc2md_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
